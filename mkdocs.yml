site_name: Pytool
site_description: Helpers for Python
site_url:
  !ENV [READTHEDOCS_CANONICAL_URL, "https://pytool.readthedocs.io/en/latest/"]

repo_url: https://github.com/shakefu/pytool
repo_name: shakefu/pytool

# Keep the same page URLs the Sphinx build produced (e.g. `pytool.html`) so
# existing deep links keep working.
use_directory_urls: false

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - API Reference: pytool.md
  - Changelog: changes.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: sphinx
            show_root_heading: false
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            line_length: 80
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

watch:
  - pytool
