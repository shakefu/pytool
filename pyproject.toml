[project]
name = "pytool"
version = "6.0.3"
description = "Pytool is a collection of utilities and language enhancements for Python"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Jacob Alheid", email = "shakefu@gmail.com"},
]
requires-python = ">=3.9,<4.0"
dependencies = [
    "simplejson >=3.19.2, <4.0.0",
]

[dependency-groups]
dev = [
    "bson >=0.5.10, <1.0.0",
    "configargparse >=1.7, <2.0",
    "coverage >=6.5.0, <7.0.0",
    "coveralls >=3.3.1, <4.0.0",
    "mock >=5.1.0, <6.0.0",
    "pre-commit >=4.2.0, <5.0.0",
    "pytest >=8.4.0, <9.0.0",
    "pytest-cov >=4.1.0, <5.0.0",
    "pytest-mock >=3.14.0, <4.0.0",
    "python-dateutil >=2.9.0.post0, <3.0.0",
]
docs = [
    "mkdocs >=1.6.0, <2.0.0",
    "mkdocs-material >=9.6.0, <10.0.0",
    "mkdocstrings[python] >=0.29.0, <2.0.0",
    # Used by mkdocstrings to format rendered signatures
    "ruff >=0.11.0, <1.0.0",
    # pymdown-extensions 12.2+ requires the Markdown instance in Highlight(),
    # which mkdocstrings before 1.0.7 does not pass. 1.0.7+ needs Python 3.11,
    # so cap below 12.2 to keep every mkdocstrings pairing working on 3.9.
    "pymdown-extensions >=10.2, <12.2",
]

# This is required so setuptools doesn't see "script" as a package
[tool.setuptools]
packages = ["pytool"]
